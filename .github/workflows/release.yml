name: Build Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create Release Zip
      run: |
        cd module
        zip -r ../elite-nas-pro-release.zip . -x "*.git*"

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: elite-nas-pro-release
        path: elite-nas-pro-release.zip
